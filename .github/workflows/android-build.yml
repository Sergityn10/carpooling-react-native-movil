name: Build Signed Android AAB

on:
  push:
    branches:
      - master
      - feature/noUbicationInSecondPlane
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Instalar dependencias de React Native
        run: npm install

      - name: 🏗️ Generar carpetas nativas (Expo Prebuild)
        run: npx expo prebuild --platform android

      - name: ☕ Configurar Java (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 🔐 Decodificar Keystore desde GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/my-upload-key.keystore

      - name: 🔍 Resolver y validar credenciales de firma
        env:
          INPUT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          INPUT_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          INPUT_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Resolver contraseñas (usa Secret si existe, o fallback del proyecto)
          STORE_PASS="${INPUT_STORE_PASS:-6442ee0a1cd0d404f80cdd131ddb5432}"
          KEY_PASS="${INPUT_KEY_PASS:-14f7f9e53e96ed8cbd8ca4f004d9860e}"

          # 2. Resolver alias (usa Secret si existe, o extrae del keystore, o fallback)
          ALIAS="${INPUT_KEY_ALIAS}"
          if [ -z "$ALIAS" ]; then
            DETECTED_ALIAS=$(keytool -list -keystore android/app/my-upload-key.keystore -storepass "$STORE_PASS" 2>/dev/null | grep -i "PrivateKeyEntry" | awk -F',' '{print $1}' | tr -d ' ' || true)
            ALIAS="${DETECTED_ALIAS:-91076f9e80d6c9763a0f01949ee88006}"
          fi

          echo "Usando alias de firma: $ALIAS"

          # 3. Validar con keytool que el keystore abre correctamente con ese alias
          keytool -list -v \
            -keystore android/app/my-upload-key.keystore \
            -storepass "$STORE_PASS" \
            -alias "$ALIAS" \
            -keypass "$KEY_PASS"

          # 4. Exportar variables para Gradle
          echo "RESOLVED_KEY_ALIAS=$ALIAS" >> $GITHUB_ENV
          echo "RESOLVED_KEYSTORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "RESOLVED_KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV

      - name: 🛠️ Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: 🏗️ Compilar AAB (Modo Release Firmado)
        run: |
          cd android
          ./gradlew bundleRelease \
              -PMYAPP_UPLOAD_STORE_FILE=my-upload-key.keystore \
              -PMYAPP_UPLOAD_STORE_PASSWORD="$RESOLVED_KEYSTORE_PASSWORD" \
              -PMYAPP_UPLOAD_KEY_ALIAS="$RESOLVED_KEY_ALIAS" \
              -PMYAPP_UPLOAD_KEY_PASSWORD="$RESOLVED_KEY_PASSWORD"

      - name: 🔍 Verificar huella digital del AAB generado
        run: |
          echo "=== Huella digital del AAB compilado ==="
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab

      - name: 📤 Subir el AAB a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
